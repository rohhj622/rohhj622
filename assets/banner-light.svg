<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 320" width="1040" height="320" role="img" aria-label="Hyunjin Roh - Developer, based in Korea. Built Urius solo, from concept to the App Store.">
  <title>Hyunjin Roh - Developer</title>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 L 0 40" fill="none" stroke="#e7e5dd" stroke-width="1"/>
    </pattern>
    <linearGradient id="veil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.00" stop-color="#fbfbf9" stop-opacity="1"/>
      <stop offset="0.52" stop-color="#fbfbf9" stop-opacity="1"/>
      <stop offset="0.78" stop-color="#fbfbf9" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card">
      <rect width="1040" height="320" rx="16"/>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .eyebrow { font-size: 15px; letter-spacing: 0.2em; fill: #7a776f; }
    .name    { font-size: 58px; font-weight: 600; letter-spacing: -0.025em; fill: #161513; }
    .name-ko { font-size: 26px; font-weight: 400; letter-spacing: 0;      fill: #a5a29a; }
    .lede    { font-size: 21px; fill: #3f3d38; }
    .pill    { font-size: 12px; letter-spacing: 0.13em; fill: #3b7a5a; }

    .cell { fill: #2f6b4f; animation: breathe 6.5s ease-in-out infinite; }
    .d1 { animation-delay: -0.4s } .d2 { animation-delay: -1.2s }
    .d3 { animation-delay: -2.1s } .d4 { animation-delay: -3.0s }
    .d5 { animation-delay: -3.8s } .d6 { animation-delay: -4.7s }
    .d7 { animation-delay: -5.5s }
    @keyframes breathe {
      0%, 100% { opacity: 0.07 }
      50%      { opacity: 0.30 }
    }
    @media (prefers-reduced-motion: reduce) {
      .cell { animation: none; opacity: 0.18 }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1040" height="320" fill="#fbfbf9"/>
    <rect width="1040" height="320" fill="url(#grid)"/>

    <!-- the 50m grid motif: lit cells clustered away from the type -->
    <g>
      <rect class="cell d1" x="720" y="120" width="40" height="40"/>
      <rect class="cell d2" x="760" y="40"  width="40" height="40"/>
      <rect class="cell d3" x="800" y="200" width="40" height="40"/>
      <rect class="cell d4" x="840" y="120" width="40" height="40"/>
      <rect class="cell d5" x="880" y="240" width="40" height="40"/>
      <rect class="cell d6" x="920" y="80"  width="40" height="40"/>
      <rect class="cell d7" x="960" y="160" width="40" height="40"/>
      <rect class="cell d3" x="760" y="240" width="40" height="40"/>
      <rect class="cell d6" x="920" y="240" width="40" height="40"/>
    </g>

    <!-- pins dropped on grid coordinates -->
    <g fill="#2f6b4f">
      <circle cx="740" cy="140" r="5"/>
      <circle cx="860" cy="140" r="5"/>
      <circle cx="940" cy="100" r="5"/>
    </g>
    <circle cx="860" cy="140" r="6" fill="none" stroke="#2f6b4f" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="6;38" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0" dur="3.6s" repeatCount="indefinite"/>
    </circle>

    <!-- fade the grid out under the type -->
    <rect width="1040" height="320" fill="url(#veil)"/>

    <text class="mono eyebrow" x="72" y="110">DEVELOPER &#183; BASED IN KOREA</text>

    <text class="sans name" x="72" y="178">Hyunjin Roh<tspan class="name-ko" dx="18">&#45432;&#54788;&#51652;</tspan></text>

    <text class="sans lede" x="72" y="222">데이터 파이프라인을 만들고, 앱은 혼자 만듭니다.</text>

    <g>
      <rect x="72" y="250" width="284" height="32" rx="16" fill="#eaf3ec"/>
      <circle cx="93" cy="266" r="4" fill="#2f6b4f"/>
      <text class="mono pill" x="107" y="271">OPEN TO NEW OPPORTUNITIES</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1039" height="319" rx="16" fill="none" stroke="#e0ded7"/>
</svg>
