<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 200" width="1040" height="200" role="img" aria-label="Urius 지표: 화면 38개, DB 마이그레이션 86개, 엣지 함수 7개, 보안 감사 3회.">
  <title>Urius — AT A GLANCE</title>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .eyebrow { font-size: 12px; letter-spacing: 0.14em; fill: #a5a29a; }
    .value   { font-size: 36px; font-weight: 500; letter-spacing: -0.03em; fill: #161513; }
    .label   { font-size: 13px; fill: #7a776f; }
    .stack   { font-size: 13px; letter-spacing: 0.01em; fill: #a5a29a; }
    .pill    { font-size: 11.5px; fill: #3b7a5a; }
  </style>

  <rect x="0.5" y="0.5" width="1039" height="199" rx="14" fill="#fbfbf9" stroke="#e0ded7"/>

  <text class="mono eyebrow" x="40" y="44">AT A GLANCE</text>

  <g>
    <rect x="862" y="30" width="138" height="24" rx="12" fill="#eaf3ec"/>
    <circle cx="876" cy="42" r="3.5" fill="#2f6b4f"/>
    <text class="sans pill" x="888" y="46">App Store 출시</text>
  </g>

  <g>
    <text class="sans value" x="40" y="110">38</text>
    <text class="sans label" x="40" y="134">화면 (route)</text>
  </g>
  <g>
    <text class="sans value" x="280" y="110">86</text>
    <text class="sans label" x="280" y="134">DB 마이그레이션</text>
  </g>
  <g>
    <text class="sans value" x="520" y="110">7</text>
    <text class="sans label" x="520" y="134">엣지 함수</text>
  </g>
  <g>
    <text class="sans value" x="760" y="110">3</text>
    <text class="sans label" x="760" y="134">보안 감사</text>
  </g>

  <line x1="40" y1="150" x2="1000" y2="150" stroke="#ecebe5"/>

  <text class="mono stack" x="40" y="177">React Native · Expo · Supabase · TypeScript · Kotlin native module</text>
</svg>
